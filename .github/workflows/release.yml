name: Release

# Fires when you push a version tag, e.g.  git tag v1.2.0 && git push --tags
# Builds a clean zip and attaches it to a GitHub Release. The update checker
# on every site running this code then sees the new version within 12 hours.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the slug and version
        id: meta
        run: |
          echo "slug=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the zip
        run: |
          SLUG="${{ steps.meta.outputs.slug }}"
          mkdir -p build/"$SLUG"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' \
                   --exclude '*.zip' --exclude '.gitignore' ./ build/"$SLUG"/
          cd build && zip -qr "../$SLUG.zip" "$SLUG"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.slug }}.zip
          generate_release_notes: true
